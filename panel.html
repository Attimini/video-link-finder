<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Video Link Finder</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <header>
    <div class="brand"><span class="dot"></span>Video Link Finder <span id="count" class="count"></span></div>
    <div class="actions">
      <button id="clear" class="ghost" title="Clear the list">Clear</button>
      <button id="close" class="ghost icon" title="Close (Esc)">✕</button>
    </div>
  </header>
  <div id="page" class="page"></div>
  <main id="list"></main>
  <footer>Open and Play send the original site's Referer. Tokenized links may expire.</footer>
  <script src="panel.js"></script>
</body>
</html>
