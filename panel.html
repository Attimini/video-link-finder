<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>Video Link Finder</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <header>
    <div class="brand"><span class="dot"></span>Video Link Finder <span id="count" class="count"></span></div>
    <div class="actions">
      <button id="clear" class="ghost" title="Svuota l'elenco">Svuota</button>
      <button id="close" class="ghost icon" title="Chiudi (Esc)">✕</button>
    </div>
  </header>
  <div id="page" class="page"></div>
  <main id="list"></main>
  <footer>Apri e Riproduci inviano il Referer del sito d'origine. I link con token possono scadere.</footer>
  <script src="panel.js"></script>
</body>
</html>
